<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="/style.css" />
		<title>Canvas room | Real-time whiteboard</title>
	</head>
	<body>
		<header class="app-header">
			<button
				class="sidebar-toggle"
				id="sidebar-toggle"
				type="button"
				aria-label="Toggle board navigation"
				title="Toggle board navigation"
			>
				☰
			</button>
			<div class="brand-lockup">
				<div class="brand-mark" aria-hidden="true">
					<span></span><span></span><span></span>
				</div>
				<div>
					<p class="brand-name">Canvas room</p>
					<p class="brand-caption">
						Make the idea visible · A shared space for rough ideas
					</p>
				</div>
			</div>
			<div class="header-actions">
				<div
					id="status"
					class="connection-status"
					role="status"
					aria-live="polite"
				>
					<span class="status-dot" aria-hidden="true"></span>
					<span class="status-label">Connecting</span>
				</div>
				<a class="auth-link" href="/auth"
					>Account <span aria-hidden="true">↗</span></a
				>
			</div>
		</header>
		<aside
			class="board-sidebar"
			id="board-sidebar"
			aria-label="Board navigation"
		>
			<div class="sidebar-heading">
				<span class="tool-label">Your boards</span>
				<button
					class="sidebar-collapse"
					id="sidebar-collapse"
					type="button"
					aria-label="Collapse board navigation"
					title="Collapse board navigation"
				>
					‹
				</button>
			</div>
			<input
				class="board-title-input"
				id="board-title"
				type="text"
				aria-label="Board title"
				maxlength="80"
			/>
			<button
				class="new-board-button"
				id="new-board-button"
				type="button"
			>
				<span aria-hidden="true">＋</span> Create new board
			</button>
			<nav
				class="recent-boards"
				id="recent-boards"
				aria-label="Recent boards"
			></nav>
			<div class="sidebar-actions">
				<button class="sidebar-action" id="rename-board" type="button">
					Rename board
				</button>
				<button class="sidebar-action" id="share-edit" type="button">
					Copy edit link
				</button>
				<button class="sidebar-action" id="share-view" type="button">
					Copy view link
				</button>
				<button class="sidebar-action" id="export-pdf" type="button">
					Export all pages as PDF
				</button>
			</div>
		</aside>

		<main class="workspace">
			<section class="board-shell" aria-label="Shared drawing board">
				<div class="board-toolbar">
					<div class="tool-group color-group">
						<span class="tool-label">Ink</span>
						<div
							class="swatches"
							role="group"
							aria-label="Ink color"
						>
							<button
								class="swatch swatch-black is-active"
								type="button"
								data-color="black"
								aria-label="Black ink"
								title="Black"
								onclick="setColor('black')"
							></button>
							<button
								class="swatch swatch-red"
								type="button"
								data-color="red"
								aria-label="Red ink"
								title="Red"
								onclick="setColor('red')"
							></button>
							<button
								class="swatch swatch-blue"
								type="button"
								data-color="blue"
								aria-label="Blue ink"
								title="Blue"
								onclick="setColor('blue')"
							></button>
							<button
								class="swatch swatch-green"
								type="button"
								data-color="green"
								aria-label="Green ink"
								title="Green"
								onclick="setColor('green')"
							></button>
						</div>
					</div>

					<div class="tool-group">
						<span class="tool-label">Weight</span>
						<div
							class="segmented-control"
							role="group"
							aria-label="Line weight"
						>
							<button
								type="button"
								data-width="2"
								onclick="setLineWidth(2)"
								title="Thin line"
							>
								Thin
							</button>
							<button
								class="is-active"
								type="button"
								data-width="5"
								onclick="setLineWidth(5)"
								title="Medium line"
							>
								Medium
							</button>
							<button
								type="button"
								data-width="10"
								onclick="setLineWidth(10)"
								title="Thick line"
							>
								Thick
							</button>
						</div>
					</div>

					<div class="toolbar-divider" aria-hidden="true"></div>
					<button
						class="tool-action"
						type="button"
						onclick="toggleEraser()"
						title="Toggle eraser"
					>
						<span aria-hidden="true">⌫</span> Eraser
					</button>
					<button
						class="tool-action tool-action-danger"
						type="button"
						onclick="clearBoard()"
						title="Clear the board"
					>
						<span aria-hidden="true">⌧</span> Clear
					</button>
					<button
						class="tool-action"
						type="button"
						onclick="addPage()"
						title="Add a new page below"
					>
						<span aria-hidden="true">＋</span> New page
					</button>
					<div
						class="history-actions"
						role="group"
						aria-label="Drawing history"
					>
						<button
							class="tool-action"
							type="button"
							onclick="undo()"
							title="Undo latest line segment"
							aria-label="Undo latest line segment"
						>
							<span aria-hidden="true">↶</span> Undo
						</button>
						<button
							class="tool-action"
							type="button"
							onclick="redo()"
							title="Redo latest undone line segment"
							aria-label="Redo latest undone line segment"
						>
							<span aria-hidden="true">↷</span> Redo
						</button>
					</div>
				</div>
				<div class="canvas-wrap" id="canvas-wrap">
					<div class="canvas-meta">
						<span>BOARD OPEN</span><span>DRAWING SYNCED LIVE</span>
					</div>
					<div
						class="pages"
						id="pages"
						aria-label="Whiteboard pages"
					></div>
				</div>
			</section>
			<p class="workspace-footer">
				<span aria-hidden="true">●</span> Invite someone by sharing this
				page URL
			</p>
		</main>
		<script src="/socket.io/socket.io.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
		<script src="/script.js"></script>
	</body>
</html>
